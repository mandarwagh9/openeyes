<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenEyes — Give Robots Vision</title>
  <meta name="description" content="Hardware-agnostic edge robot vision framework with world models">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="nav-minimal">
    <a href="index.html" class="logo">
      <img src="assets/images/logo.svg" alt="OpenEyes">
      OpenEyes
    </a>
    <a href="https://github.com/mandarwagh9/openeyes" target="_blank">GitHub</a>
  </nav>

  <section class="hero-minimal">
    <div class="humanoid-container">
      <div class="humanoid">
        <!-- Head -->
        <div class="head">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face left"></div>
          <div class="face right"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="fov-cone"></div>
          <div class="scan-line"></div>
        </div>
        
        <!-- Torso -->
        <div class="torso">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
        
        <!-- Arms -->
        <div class="arm left">
          <div class="segment upper"></div>
          <div class="segment lower"></div>
        </div>
        <div class="arm right">
          <div class="segment upper"></div>
          <div class="segment lower"></div>
        </div>
        
        <!-- Legs -->
        <div class="leg left">
          <div class="segment upper"></div>
          <div class="segment lower"></div>
        </div>
        <div class="leg right">
          <div class="segment upper"></div>
          <div class="segment lower"></div>
        </div>
      </div>
    </div>

    <h1>Give Robots Vision</h1>
    <p class="tagline">Edge robot vision framework with world models</p>
    <a href="getting-started.html" class="cta">Get Started</a>
  </section>

  <div class="code-minimal">
    <span class="prompt">$</span>python src/main.py --debug
  </div>

  <footer class="footer-minimal">
    <a href="getting-started.html">Docs</a>
    <a href="hardware.html">Hardware</a>
    <a href="https://github.com/mandarwagh9/openeyes">GitHub</a>
  </footer>
</body>
</html>
