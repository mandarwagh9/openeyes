camera:
  source: 0
  width: 640
  height: 480
  fps: 30

models:
  yolo:
    path: models/yolo11n.engine
    confidence: 0.5
    iou_threshold: 0.45
  depth:
    enabled: false
    path: models/depth_midas.pt
  face:
    skip_frames: 3
  gesture:
    skip_frames: 3
  pose:
    skip_frames: 3

output:
  format: json
  protocol: udp
  host: 127.0.0.1
  port: 5000
  fps: 30

performance:
  target_fps: 30
  max_latency_ms: 50
  use_tensorrt: true
  parallel_models: true
  tensorrt:
    precision: fp16  # fp16, int8, fp32
    dla_enabled: false
    dla_core: 0
    workspace_size_gb: 1
    dla_batch_size: 1
  batch_inference:
    enabled: false
    batch_size: 1
    max_batch_size: 4
  monitoring:
    enabled: true
    stats_interval_sec: 5
    log_performance: true

tracking:
  enabled: true
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  follow_enabled: false

ros2:
  enabled: false
  node_name: "openeyes_vision"
  topics:
    detections: "/vision/detections"
    depth: "/vision/depth"
    faces: "/vision/faces"
    gestures: "/vision/gestures"
    poses: "/vision/poses"
    cmd: "/vision/cmd"
    status: "/vision/status"
  frame_id: "camera_link"
  confidence_threshold: 0.5
  max_depth_range: 5.0

debug: false
