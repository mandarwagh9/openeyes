camera:
  source: 0
  width: 640
  height: 480
  fps: 30

models:
  yolo:
    path: models/yolo11n.engine
    confidence: 0.5
    iou_threshold: 0.45
  depth:
    enabled: false
    path: models/depth_midas.pt
  face:
    skip_frames: 3
  gesture:
    skip_frames: 3
    confidence: 0.1
  pose:
    skip_frames: 3

output:
  format: json
  protocol: udp
  host: 127.0.0.1
  port: 5000
  fps: 30

performance:
  target_fps: 30
  max_latency_ms: 50
  use_tensorrt: true
  parallel_models: true
  tensorrt:
    precision: fp16  # fp16, int8, fp32
    dla_enabled: false
    dla_core: 0
    workspace_size_gb: 1
    dla_batch_size: 1
  batch_inference:
    enabled: false
    batch_size: 1
    max_batch_size: 4
  monitoring:
    enabled: true
    stats_interval_sec: 5
    log_performance: true

tracking:
  enabled: true
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  follow_enabled: false
  follow_distance_min: 0.75  # arm length (stops if closer)
  follow_distance_max: 1.25  # follows if farther

ros2:
  enabled: false
  node_name: "openeyes_vision"
  qos_profile: "default"  # default, sensor, command, best_effort, reliable
  actions_enabled: false
  time_sync: false
  topics:
    detections: "/vision/detections"
    depth: "/vision/depth"
    faces: "/vision/faces"
    gestures: "/vision/gestures"
    poses: "/vision/poses"
    cmd: "/vision/cmd"
    status: "/vision/status"
  frame_id: "camera_link"
  confidence_threshold: 0.5
  max_depth_range: 5.0

multi_camera:
  enabled: false
  sources: [0]  # List of camera indices

slam:
  enabled: false
  visual_odom_enabled: false
  depth_to_scan_enabled: false
  focal_length: 500.0
  baseline: 0.1
  max_features: 100
  quality_level: 0.01
  min_distance: 10
  scan_topic: "/scan"
  odom_topic: "/odom"
  range_min: 0.1
  range_max: 10.0
  angle_min: -1.57
  angle_max: 1.57

nav2:
  enabled: false
  map_file: ""
  params_file: ""
  base_frame: "base_link"
  odom_frame: "odom"
  map_frame: "map"
  autostart: true

vla:
  enabled: false
  model_type: "smolvla"  # smolvla, openvla, octo
  model_name: ""  # Override default model
  device: "cuda"
  quantize: true
  instruction: "follow the person"  # Default instruction
  fallback_to_rule_based: true  # Use rule-based if model fails

depth:
  model: "da3-small"  # da3-small, da3-base, midas-small
  enabled: true
  skip_frames: 8

world_model:
  enabled: false
  type: "lewm"  # lewm, vjepa2
  device: "cuda"
  precision: "fp16"
  latent_dim: 384
  use_dinov2: true
  plan_horizon: 10
  plan_samples: 100
  prediction_fps: 30
  occlusion_frames: 5
  safety_predict: false

debug: false
