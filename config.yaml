camera:
  source: 0
  width: 640
  height: 480
  fps: 30

models:
  yolo:
    path: models/yolo11n.engine
    confidence: 0.5
    iou_threshold: 0.45
  depth:
    enabled: false
    path: models/depth_midas.pt
  face:
    skip_frames: 3
  gesture:
    skip_frames: 3
  pose:
    skip_frames: 3

output:
  format: json
  protocol: udp
  host: 127.0.0.1
  port: 5000
  fps: 30

performance:
  target_fps: 30
  max_latency_ms: 50
  use_tensorrt: true
  parallel_models: true

debug: false
