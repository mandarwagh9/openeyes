site_name: OpenEyes
site_description: Open-source vision system for humanoid robots on NVIDIA Jetson Orin Nano with full ROS2 integration
site_url: https://mandarwagh9.github.io/openeyes
repo_url: https://github.com/mandarwagh9/openeyes
repo_name: mandarwagh9/openeyes

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.expand
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.tabs
    - announce.dismiss
    - footer
    - header
  icon:
    repo: fontawesome/brands/github
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg

extra_css:
  - assets/css/extra.css

extra:
  homepage: https://github.com/mandarwagh9/openeyes
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mandarwagh9/openeyes
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/u/mandarwagh9
  generator: false

plugins:
  - search:
      lang: en
      prebuild_index: true

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/quickstart.md
      - getting-started/installation.md
      - getting-started/configuration.md
  - User Guide:
      - user-guide/commands.md
      - user-guide/ros2.md
  - Development:
      - development/architecture.md
      - development/api.md
      - development/contributing.md
  - Reference:
      - reference/technical-spec.md
      - reference/hardware.md
  - Troubleshooting:
      - troubleshooting/common-issues.md
      - troubleshooting/faq.md

markdown_extensions:
  - attr_list
  - tables
  - fenced_code
  - codehilite
  - toc:
      permalink: true
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true

copyright: >
  &copy; 2026 OpenEyes Project. Built with ❤️ for humanoid robots.